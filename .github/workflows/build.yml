name: build

# Daily: if kernel.org has a newer 6.12.y than the newest "kernel-<ver>"
# release here, build the velo540 kernel for it (Debian trixie config + DSA +
# board patches) and attach the .debs to a new release. Then rebuild
# velo540-tools and the meta packages and publish the signed apt repository
# (the newest KEEP kernels) on GitHub Pages.

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      kernel:
        description: "Build this 6.12.y version (e.g. 6.12.112) even if a release exists"
        required: false
  push:
    branches: [main]
    paths: ["kernel/**", "tools/**", "pkg/**", "repo/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  SERIES: "6.12"
  KEEP: "2"

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_KERNEL: ${{ github.event.inputs.kernel }}
        run: |
          if [ -n "$INPUT_KERNEL" ]; then
            VER=$(echo "$INPUT_KERNEL" | tr -cd '0-9.')
            BUILD=true
          else
            VER=$(curl -fsSL https://www.kernel.org/releases.json |
              grep -o "\"$SERIES\.[0-9]*\"" | tr -d '"' | sort -V | tail -n 1)
            [ -n "$VER" ] || { echo "no $SERIES.y on kernel.org"; exit 1; }
            if gh release view "kernel-$VER" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              BUILD=false
            else
              BUILD=true
            fi
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "kernel $VER, build: $BUILD"

  kernel:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
              /usr/local/share/boost /usr/share/swift
          sudo docker image prune -af > /dev/null
          df -h /

      - name: Build kernel in debian:trixie
        env:
          VER: ${{ needs.check.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/build" out
          docker run --rm -v "$PWD:/src" -v "$RUNNER_TEMP/build:/build" -w /src \
              debian:trixie kernel/ci-build.sh "$VER" /src/out
          ls -la out

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.check.outputs.version }}
        run: |
          gh release delete "kernel-$VER" -y --cleanup-tag 2> /dev/null || true
          gh release create "kernel-$VER" out/*.deb out/base-config-* \
              --title "Linux $VER-velo540" \
              --notes "Linux $VER with the VeloCloud Edge 520/540 patches, built on Debian trixie with $(ls out/base-config-* | sed 's#.*/base-config-##') as base config."

  publish:
    needs: [check, kernel]
    if: always() && needs.check.result == 'success' && needs.kernel.result != 'failure' && needs.kernel.result != 'cancelled'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Kernel packages of the newest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p debs
          TAGS=$(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName' |
              grep '^kernel-' | sed 's/^kernel-//' | sort -V | tail -n "$KEEP")
          [ -n "$TAGS" ] || { echo "no kernel releases yet"; exit 1; }
          for V in $TAGS; do
            gh release download "kernel-$V" -R "$GITHUB_REPOSITORY" -p '*.deb' -D debs
          done
          echo "NEWEST=$(echo "$TAGS" | tail -n 1)" >> "$GITHUB_ENV"
          ls -la debs

      - name: mdio, velo540-tools and meta packages (debian:trixie)
        run: |
          docker run --rm -v "$PWD:/src" -w /src debian:trixie sh -c "
              tools/build-mdio.sh /tmp/mdio &&
              apt-get install -y -q git > /dev/null &&
              git config --global --add safe.directory /src &&
              pkg/build-debs.sh /src/debs /tmp/mdio/mdio $NEWEST"
          sudo chown -R "$(id -u):$(id -g)" debs

      - name: Signed apt repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          sudo apt-get install -y -q apt-utils > /dev/null
          KEY=
          if [ -n "$APT_SIGNING_KEY" ]; then
            export GNUPGHOME="$RUNNER_TEMP/gnupg"
            mkdir -m 700 "$GNUPGHOME"
            printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
            KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          fi
          repo/build-repo.sh debs public $KEY
          cp README.md public/ 2> /dev/null || true
          touch public/.nojekyll
          rm -rf "$RUNNER_TEMP/gnupg"
          du -sh public

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
